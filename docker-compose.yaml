services:
  db:
    image: postgres:17
    container_name: "db_postgres"
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "06042026"
      POSTGRES_DB: "db_teste"
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db_network

  pg_admin:
    image: dpage/pgadmin4
    container_name: "pg_admin"
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "testelindo@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "06042026"
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    networks:
      - db_network

volumes:
  db:
  pgadmin_data:

networks:
  db_network: